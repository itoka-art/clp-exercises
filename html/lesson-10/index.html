<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML lesson-10 フォーム</title>
    <meta name="description" content="HTMLの学習">
</head>

<body>
    <form action="/contact" method="post">
        <label for="name">名前：</label>
        <input type="text" id="name" name="username" placeholder="名前を入力">

        <label for="email">メールアドレス：</label>
        <input type="email" id="email" name="email" placeholder="メールアドレスを入力">

        <label for="contact">お問い合わせ:</label>
        <select id="contact" name="contact">
            <option value="service">サービスについて</option>
            <option value="other">その他のお問い合わせ</option>
        </select>

        <label for="message">メッセージ：</label>
        <textarea id="message" name="message" placeholder="自由に記述"  cols="9"></textarea>

        <button type="submit">送信</button>
        <button type="reset">リセット</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>

    <title>HTML lesson-08 テーブル</title>
    <meta name="description" content="HTML学習中">
</head>

<body>
<table>

  <thead>
    <tr>
      <th>名前</th>
      <th>年齢</th>
      <th>職業</th>
    </tr>

  <tbody>
    <tr>
      <td>山田太郎</td>
      <td>25歳</td>
      <td>営業</td>
    </tr>
    <tr>
      <td>田中花子</td>
      <td>22歳</td>
      <td>エンジニア</td>
    </tr>
    <tr>
      <td>佐藤健太郎</td>
      <td>20歳</td>
      <td>デザイナー</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td colspan="3">合計3名</td>
    </tr>
  </tfoot>

</table>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Googleタグマネージャーのスクリプトをここに設置 -->
    <title>HTMLの基礎</title>

    <meta name="description" content="HTMLの基礎を勉強中">

    <!-- canonical -->
    <link rel="canonical" href="https://example.com/">

    <!-- robots -->
    <meta name="robots" content="index, follow">
    
    <!-- OGP設定 -->
    <meta property="og:title" content="HTML基礎02">
    <meta property="og:description" content="HTMLの基礎を勉強中">
    <meta property="og:image" content="https://example.com/ogp.jpg">
    <meta property="og:url" content="https://example.com/">
</head>

<body>
</body>
</html>

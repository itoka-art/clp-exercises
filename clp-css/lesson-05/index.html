<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS lesson-05 インライン要素とブロック要素</title>
    <meta name="description" content="CSS学習中">

<style>

    span{
        display: block;
    }

    div{
        display: inline;
    }

    a{
        display: inline-block;
        width: 120px;
        height: 40px;
    }

</style>

</head>

<body>
    <span>ブロック表示のテキスト</span>
    <div>インライン表示のテキスト</div>
    <a href="#">サイズ指定されたリンク</a>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS lesson-11 </title>
    <meta name="description" content="CSS学習中">

<style>

    .button{
        background-color: blue;
        transition: background-color 0.3s ease ;
    }

    .button:hover{
        background-color: red;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
        }
        to{
            opacity: 1;
        }
    }

    h1{
        animation: fadeIn 1s ease forwards;
    }

</style>

</head>


<body>
    <h1>CSSアニメーションの練習</h1>
<button class="button">クリック</button>
</body>
</html>

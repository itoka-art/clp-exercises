<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS lesson-13 擬似要素</title>

    <style>
        p::before{
            content: "※";
            color: red;
        }
        label.required::after{
            content: "（必須）";
            color: red;
            font-size: 12px;
        }
        input::placeholder{
            color: #aaa;
        }
    </style>
</head>

<body>
    <p class="text">以下の項目を入力してください</p>
    <label for="text" class="required">お名前</label>
    <input type="text" id="name" placeholder="例：山田太郎">
</body>
</html>

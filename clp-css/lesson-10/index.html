<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS lesson-10 グリッドレイアウト</title>
    <meta name="description" content="CSS学習中">

<style>
    .grid-container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        gap: 16px;
    }

    .grid-item{
        background-color: aqua;
    }

    .grid-item--wide{
        grid-column: span 2;
    }

</style>

</head>


<body>
<div class="grid-container">
    <div class="grid-item grid-item--wide">アイテム1</div>
    <div class="grid-item">アイテム2</div>
    <div class="grid-item">アイテム３</div>
    <div class="grid-item">アイテム４</div>
    <div class="grid-item">アイテム５</div>
    <div class="grid-item">アイテム６</div>
</div>
</body>
</html>
